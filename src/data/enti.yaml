  livello: ue
  luogo: torino
  scala: transfrontaliero
  tipo: autorita
  poteri: [regola, vigila, indirizza]
  temi: [dati, web]
  sito: https://www.cnil.fr/
  ruolo: >-
    Autorità francese di protezione dei dati. Conta per chi da Torino ha clienti, utenti o
    dipendenti in Francia. Con lo sportello unico del GDPR (art. 56), se lo stabilimento principale
    è in Italia l'autorità capofila resta il Garante italiano e la CNIL partecipa come autorità
