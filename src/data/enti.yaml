    Autorità svizzera per la nuova legge federale sulla protezione dei dati (nLPD, in vigore dal
    1/09/2023), che si applica anche a trattamenti svolti dall'estero con effetti in Svizzera. La
    Svizzera ha una decisione di adeguatezza UE, quindi i trasferimenti di dati verso la Svizzera
    sono liberi.
