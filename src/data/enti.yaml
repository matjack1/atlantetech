  ruolo: >-
    Sportello unico per le attività produttive (SUAP) ed edilizia (SUE) online, anagrafe e
    certificati, tributi locali, regolamenti comunali (commercio, occupazione di suolo pubblico,
    videosorveglianza urbana). Il territorio è diviso in circoscrizioni, che gestiscono servizi di
    prossimità. Come PA, il Comune è soggetto a CAD, accessibilità, trasparenza e, per i suoi
    acquisti di software e servizi, al codice dei contratti pubblici.
  note: Numero e competenze attuali delle circoscrizioni.

- id: to-city-lab
  nome: Torino City Lab
  livello: territoriali
  luogo: torino
  scala: citta
  tipo: ricerca
  poteri: [autorizza, supporta]
  temi: [ai]
  sito: https://torinocitylab.it/
  ruolo: >-
    Iniziativa del Comune che consente a imprese e centri di ricerca di sperimentare in città, in
    condizioni reali, soluzioni innovative come guida autonoma, droni, AI e servizi urbani, con le
    autorizzazioni del Comune. Un banco di prova locale, distinto dalle sandbox nazionali previste
    dall'AI Act.
  note: Scritto a memoria; modalità di adesione e ambiti attivi.

- id: to-citta-metropolitana
  nome: Città metropolitana di Torino
  livello: territoriali
  luogo: torino
  scala: metropoli
  tipo: istituzioni
  poteri: [regola, supporta]
  sito: https://www.cittametropolitana.torino.it/
  ruolo: >-
    Ente di area vasta che ha preso il posto della Provincia: pianificazione territoriale, strade,
    scuole superiori, ambiente. Supporta i Comuni più piccoli, anche su servizi digitali e
    stazione appaltante, ed è partner italiano del programma ALCOTRA.
  note: Servizi digitali offerti ai Comuni del territorio.

- id: to-cciaa
  nome: Camera di commercio di Torino
  livello: territoriali
  luogo: torino
  scala: metropoli
  tipo: agenzie
  soggetti: [artigiani, cooperative, saas]
  poteri: [registra, supporta]
  temi: [documenti, settore]
  sito: https://www.to.camcom.it/
  ruolo: >-
    Registro delle imprese e albo delle cooperative per la provincia. Rilascia firma digitale, CNS
    e identità digitale per le imprese, e tramite il Punto impresa digitale offre autovalutazioni
    di maturità digitale e cibersicurezza. È partner dell'EDIH EXPAND.

- id: to-uffici-statali
  nome: Uffici statali a Torino
  livello: territoriali
  luogo: torino
  scala: metropoli
  tipo: agenzie
  poteri: [autorizza, vigila]
  temi: [lavoro, fisco]
  ruolo: >-
    Articolazioni locali degli enti nazionali. L'Ispettorato territoriale del lavoro autorizza gli
    strumenti di controllo a distanza per le imprese con unità solo nella provincia e svolge le
    ispezioni. Le direzioni provinciali dell'Agenzia delle entrate seguono le pratiche fiscali.

- id: to-ordine-ingegneri
  nome: Ordine degli ingegneri della provincia di Torino
  livello: territoriali
  luogo: torino
  scala: metropoli
  tipo: categoria
  soggetti: [ingegneri]
  poteri: [registra, indirizza, autorizza]
