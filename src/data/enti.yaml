    sezione specializzata in materia di impresa, presso Tribunale e Corte d'appello, è competente
    per tutto il Piemonte e per la Valle d'Aosta (L. 27/2012, art. 2) su marchi, brevetti, diritto
    d'autore, concorrenza e controversie societarie.
  note: Criterio di competenza territoriale per l'opposizione ai provvedimenti del Garante.

- id: to-atenei
