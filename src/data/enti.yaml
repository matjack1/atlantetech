    Centro servizi per il volontariato della Città metropolitana, nato nel 2015 dalla fusione di
    VSSP e Idea Solidale. Assiste gratuitamente associazioni ed ETS su RUNTS, statuti, adempimenti,
    privacy e comunicazione.
  note: Servizi specifici su RUNTS e privacy.

- id: to-diocesi
  nome: Arcidiocesi di Torino
  livello: territoriali
  luogo: torino
  scala: metropoli
  tipo: categoria
  soggetti: [parrocchie]
