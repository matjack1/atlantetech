    anche con Paesi non UE come Svizzera e Liechtenstein. I gruppi d'azione si occupano tra l'altro
    di connettività e servizi digitali. Orienta i fondi, ma non fa regole.
  note: Scritto a memoria; gruppi d'azione attivi sul digitale.

- id: cnil
  nome: Commission nationale de l'informatique et des libertés
